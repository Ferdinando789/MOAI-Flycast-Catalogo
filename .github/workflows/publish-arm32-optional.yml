name: Publish verified MOAI Flycast Vulkan ARM32 optional module
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/payload/flycast-vulkan-arm32.json'
permissions:
  contents: write
concurrency:
  group: publish-flycast-arm32-r1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified signed ARM32 module from public chunks
        run: |
          set -euo pipefail
          test -s modules/payload/flycast-vulkan-arm32.json
          test -s modules/payload/chunk_000.txt
          cat modules/payload/chunk_*.txt | base64 -d > /tmp/flycast_core_arm32.apk
          cp modules/payload/flycast-vulkan-arm32.json /tmp/flycast-vulkan-arm32.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('/tmp/flycast_core_arm32.apk')
          m=json.loads(pathlib.Path('/tmp/flycast-vulkan-arm32.json').read_text())
          assert m['schema']==1 and m['abi']=='armeabi-v7a'
          assert m['split']=='flycast_core'
          assert m['package']=='com.infomak.moailite.flycastnative'
          assert m['versionCode']==58
          assert m['size']==apk.stat().st_size
          assert m['sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert m['download_url']=='https://github.com/Ferdinando789/MOAI-Flycast-Catalogo/releases/download/flycast-vulkan-arm32-r1/flycast_core_arm32.apk'
          print('Verified signed ARM32 split:',m['size'],m['sha256'])
          PY
      - name: Verify split Android package metadata
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ ! -x "$AAPT" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$AAPT" dump badging /tmp/flycast_core_arm32.apk > /tmp/flycast-badging.txt
          head -5 /tmp/flycast-badging.txt
          "$AAPT" dump xmltree /tmp/flycast_core_arm32.apk AndroidManifest.xml | grep flycast_core
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/flycast_core_arm32.apk
      - name: Publish optional signed module as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cp /tmp/flycast_core_arm32.apk /tmp/release/flycast_core_arm32.apk
          TAG=flycast-vulkan-arm32-r1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/release/flycast_core_arm32.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" /tmp/release/flycast_core_arm32.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "MOAI Flycast Vulkan ARM32 - optional module r1" \
              --notes "Signed optional armeabi-v7a split APK for MOAI experimental base versionCode 58. No ROMs or BIOS included." \
              --prerelease
          fi
      - name: Activate catalog manifest after release upload
        run: |
          set -euo pipefail
          mkdir -p modules
          cp /tmp/flycast-vulkan-arm32.json modules/flycast-vulkan-arm32.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/flycast-vulkan-arm32.json
          if ! git diff --cached --quiet; then
            git commit -m "publish verified ARM32 Flycast module manifest"
            git push origin HEAD:main
          fi
